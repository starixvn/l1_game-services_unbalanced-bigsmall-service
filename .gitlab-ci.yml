variables:
  SMOKE_PRODUCT_NAME: UnbalancedBigsmall
  
include:
  - project: "ci/repos-ci/pentagon_l1_unbalanced_bigsmall_service"
    ref: master
    file: "gitlab-ci.yml"

integration-tests:
  stage: test
  needs: ['unit-test-js']
  tags:
    - docker

  services:
    - name: registry.nexdev.net:5050/docker/database/mongo:4.4.8
      alias: mongo
      
  image: registry.nexdev.net:5050/docker/node:18.1-slim
  before_script:
    - cp ./src/app-configs.js ./src/app-configs.original.js
    - cp ./src/app-configs.IGT.js ./src/app-configs.js
    - npm set registry http://npm.lumigame.com
    - yarn install

  script:
    - npm run integration-test

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

  artifacts:
    when: always
    paths:
      - ./coverage
    reports:
      junit:
        - junit.xml
    expire_in: 1 day

unit-test-js:
  artifacts:
    reports:
      junit: coverage/*.xml
      cobertura: coverage/cobertura-coverage.xml
